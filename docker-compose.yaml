services:
  server:
    build: ./
    env_file:
      - .env
    container_name: hd-prep-server-prod
    ports:
      - "3000:3000"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - server
    init: true
    stop_grace_period: 10s
    restart: unless-stopped
