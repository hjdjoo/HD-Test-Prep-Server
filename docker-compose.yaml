version: '3.8'

services:
  server:
    image: darryljoo/hd-prep-server-prod
    env_file:
      - .env
    container_name: hd-prep-server-prod
    ports:
      - "3000:3000"
    restart: unless-stopped
    command: npm start
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
